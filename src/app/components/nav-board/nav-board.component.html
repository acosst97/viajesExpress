  <ul class="navbar-menu">
    <li class="nav-item" *ngIf="tieneRol('ADMINISTRADOR')">
      <a [routerLink]="['/dashboard/usuarios']" class="nav-link">
        <i class="fa fa-users"></i> <span class="link-text">Usuarios</span>
      </a>
    </li>
    <li class="nav-item" *ngIf="tieneRol('EMPLEADO') || tieneRol('ADMINISTRADOR')">
      <a [routerLink]="['/dashboard/vehiculos']" class="nav-link">
        <i class="fa fa-tasks"></i> <span class="link-text">Vehículos</span>
      </a>
    </li>
    <li class="nav-item" *ngIf="tieneRol('CLIENTE') || tieneRol('ADMINISTRADOR')">
      <a [routerLink]="['/dashboard/reservaciones']" class="nav-link">
        <i class="fa fa-calendar"></i> <span class="link-text">Reservaciones</span>
      </a>
    </li>
    <li class="nav-item" *ngIf="tieneRol('ADMINISTRADOR')">
      <a [routerLink]="['/dashboard/servicios']" class="nav-link">
        <i class="fa fa-wrench"></i> <span class="link-text">Servicios</span>
      </a>
    </li>
  </ul>
